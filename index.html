<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aljamea-tus-Saifiyah Facilities Management Dept (Marol)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS for Excel/CSV Import/Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        .active-tab { border-bottom: 3px solid #10B981; color: #065F46; font-weight: 600; }
        .sub-tab-active { background-color: #065F46; color: white; }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col">

    <!-- Top Navigation Header -->
    <header class="bg-emerald-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center space-x-3 mb-3 md:mb-0">
                <i class="fa-solid font-bold fa-building-user text-3xl text-emerald-400"></i>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold tracking-wide">Aljamea-tus-Saifiyah Facilities Management Dept (Marol)</h1>
                    <p class="text-xs text-emerald-200">Estates & Infrastructure Management Portal</p>
                </div>
            </div>
            
            <!-- User Profile & Admin Badge -->
            <div class="flex items-center space-x-4">
                <div class="text-right">
                    <span id="currentUserEmail" class="block text-sm font-medium text-emerald-100">murtaza.kheraluwala@jameasaifiyah.edu</span>
                    <span id="currentUserRole" class="text-xs bg-emerald-700 text-emerald-100 px-2 py-0.5 rounded-full font-semibold">Admin</span>
                </div>
                <button onclick="toggleUserModal()" class="bg-emerald-800 hover:bg-emerald-700 text-white p-2 rounded-full border border-emerald-600 transition" title="User Settings & Role Switcher">
                    <i class="fa-solid fa-user-gear text-lg"></i>
                </button>
            </div>
        </div>

        <!-- Primary Module Navigation Tabs -->
        <div class="bg-emerald-950 border-t border-emerald-800">
            <div class="max-w-7xl mx-auto px-4 flex space-x-2">
                <button onclick="switchModule('dawat-estates')" id="mod-dawat-estates" class="px-5 py-3 text-sm font-semibold text-emerald-100 hover:bg-emerald-800 rounded-t-lg transition flex items-center space-x-2 active-tab">
                    <i class="fa-solid fa-city text-emerald-400"></i>
                    <span>Dawat Estates</span>
                </button>
                <button onclick="switchModule('inventory')" id="mod-inventory" class="px-5 py-3 text-sm font-semibold text-emerald-300 hover:bg-emerald-800 rounded-t-lg transition flex items-center space-x-2">
                    <i class="fa-solid fa-boxes-stacked"></i>
                    <span>Inventory Management</span>
                </button>
                <button onclick="switchModule('faculty-dir')" id="mod-faculty-dir" class="px-5 py-3 text-sm font-semibold text-emerald-300 hover:bg-emerald-800 rounded-t-lg transition flex items-center space-x-2">
                    <i class="fa-solid fa-id-card"></i>
                    <span>Faculty Directory</span>
                </button>
                <button onclick="switchModule('admin-access')" id="mod-admin-access" class="px-5 py-3 text-sm font-semibold text-emerald-300 hover:bg-emerald-800 rounded-t-lg transition flex items-center space-x-2">
                    <i class="fa-solid fa-user-shield"></i>
                    <span>Admin Access & Invitations</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto w-full px-4 py-6 flex-grow">

        <!-- MODULE: DAWAT ESTATES -->
        <div id="module-dawat-estates" class="space-y-6">
            
            <!-- 6 Sub-Header Navigation Bar -->
            <div class="bg-white rounded-lg shadow p-2 flex flex-wrap gap-2 border">
                <button onclick="switchSubHeader('estate-details')" id="sub-estate-details" class="px-4 py-2 rounded-md text-sm font-medium transition sub-tab-active flex items-center space-x-2">
                    <i class="fa-solid fa-building"></i>
                    <span>1. Estate Details</span>
                </button>
                <button onclick="switchSubHeader('allocation')" id="sub-allocation" class="px-4 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100 transition flex items-center space-x-2">
                    <i class="fa-solid fa-key"></i>
                    <span>2. Allocation</span>
                </button>
                <button onclick="switchSubHeader('maintenance')" id="sub-maintenance" class="px-4 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100 transition flex items-center space-x-2">
                    <i class="fa-solid fa-screwdriver-wrench"></i>
                    <span>3. Maintenance Data</span>
                </button>
                <button onclick="switchSubHeader('bachelor')" id="sub-bachelor" class="px-4 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100 transition flex items-center space-x-2">
                    <i class="fa-solid fa-user-group"></i>
                    <span>4. Bachelor Flats</span>
                </button>
                <button onclick="switchSubHeader('vacant-bills')" id="sub-vacant-bills" class="px-4 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100 transition flex items-center space-x-2">
                    <i class="fa-solid fa-file-invoice-dollar
